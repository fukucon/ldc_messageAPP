<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>就労規則チャットボット</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; background: #f1f3f4; }
    body { display: flex; flex-direction: column; height: 100dvh; }

    header { flex: 0 0 auto; background: #0b8043; color: #fff; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    header .title { font-size: 16px; font-weight: 600; }
    header a { color: #fff; font-size: 12px; opacity: .9; text-decoration: none; }

    #log { flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.q { align-self: flex-end; background: #0b8043; color: #fff; border-bottom-right-radius: 4px; }
    .msg.a { align-self: flex-start; background: #fff; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
    .msg.a.loading { color: #888; font-style: italic; }
    .hint { text-align: center; color: #9aa0a6; font-size: 13px; margin: 16px 8px; line-height: 1.6; }

    .composer { flex: 0 0 auto; display: flex; gap: 8px; padding: 8px; background: #fff; border-top: 1px solid #e0e0e0; }
    .composer textarea { flex: 1; resize: none; border: 1px solid #ccc; border-radius: 20px; padding: 10px 14px; font-size: 15px; max-height: 100px; font-family: inherit; }
    .composer button { flex: 0 0 auto; width: 44px; height: 44px; border: none; border-radius: 50%; background: #0b8043; color: #fff; font-size: 18px; }
    .composer button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <header>
    <div class="title">就労規則チャットボット</div>
  </header>

  <div id="log">
    <div class="hint">就労規則についての質問を入力してください。<br>例：「有給休暇は何日ありますか？」「遅刻したときのルールは？」</div>
  </div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="質問を入力"></textarea>
    <button id="send" onclick="ask()">➤</button>
  </div>

  <script>
    var logEl = document.getElementById('log');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // 吹き出しを追加して返す
    function addMsg(text, cls) {
      var div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerHTML = esc(text);
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
      return div;
    }

    function ask() {
      var input = document.getElementById('input');
      var question = input.value.trim();
      if (!question) return;

      addMsg(question, 'q');
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('send').disabled = true;

      // 回答待ちのプレースホルダ
      var loading = addMsg('考え中...', 'a loading');

      google.script.run
        .withSuccessHandler(function (answer) {
          loading.className = 'msg a';
          loading.innerHTML = esc(answer);
          logEl.scrollTop = logEl.scrollHeight;
          document.getElementById('send').disabled = false;
        })
        .withFailureHandler(function (err) {
          loading.className = 'msg a';
          loading.innerHTML = esc('エラー: ' + err.message);
          document.getElementById('send').disabled = false;
        })
        .askWorkRules(question);
    }

    // 入力欄の自動リサイズ・Enter送信（Shift+Enterで改行）
    var input = document.getElementById('input');
    input.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
    });
  </script>
</body>
</html>
