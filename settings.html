<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIチャットボット設定</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f1f3f4; color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    }
    header { background: #0b8043; color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
    header .title { font-size: 16px; font-weight: 600; flex: 1; }
    header a { color: #fff; font-size: 13px; text-decoration: none; background: rgba(255,255,255,.2); border-radius: 16px; padding: 7px 13px; }

    main { max-width: 820px; margin: 0 auto; padding: 16px 16px 96px; }

    .note { font-size: 13px; color: #5f6368; line-height: 1.7; background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
    .note[hidden] { display: none; }

    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 15px; color: #0b8043; }

    /* ルール1件の行 */
    .rule {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .rule .rid {
      flex: 0 0 auto; min-width: 44px; text-align: center;
      background: #e8f5ee; color: #0b8043; border: 1px solid #b7ddc8;
      border-radius: 6px; padding: 7px 6px; font-size: 12px; font-weight: 600;
    }
    .rule .rid.new { background: #fff4e5; color: #b06000; border-color: #f0c98a; }
    /* font-size:16px は iOS で入力時に画面が拡大されるのを防ぐため */
    .rule select {
      flex: 0 0 auto; width: 130px; padding: 9px 8px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 16px; font-family: inherit; background: #fff;
    }
    .rule input {
      flex: 1 1 220px; min-width: 0; padding: 10px 12px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 16px; font-family: inherit;
    }
    .rule select:disabled, .rule input:disabled { background: #f5f5f5; color: #80868b; }
    .rule .del {
      flex: 0 0 auto; border: none; background: #fdecea; color: #b3261e;
      border-radius: 8px; width: 38px; height: 38px; font-size: 16px; cursor: pointer;
    }
    .rule .del:disabled { opacity: .4; cursor: default; }

    .add-btn {
      border: 1px dashed #0b8043; background: #fff; color: #0b8043;
      border-radius: 8px; padding: 11px 16px; font-size: 14px; cursor: pointer;
      width: 100%; font-family: inherit; margin-top: 4px;
    }
    .add-btn:disabled { opacity: .4; cursor: default; }
    .empty { color: #9aa0a6; font-size: 14px; padding: 10px 0; }

    .preview { margin-top: 16px; font-size: 12px; color: #5f6368; line-height: 1.7; }
    .preview strong { color: #202124; display: block; margin-bottom: 4px; }
    .preview .line { background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 6px; padding: 6px 9px; margin-top: 4px; word-break: break-all; font-family: monospace; }

    /* 画面下に固定した保存バー */
    .savebar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      background: #fff; border-top: 1px solid #e0e0e0; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px; justify-content: center;
    }
    .savebar button {
      background: #0b8043; color: #fff; border: none; border-radius: 8px;
      padding: 12px 28px; font-size: 15px; cursor: pointer;
    }
    .savebar button:disabled { opacity: .5; cursor: default; }
    #status { font-size: 14px; color: #0b8043; }

    /* ===== 共通モーダル ===== */
    .modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); padding: 16px; }
    .modal[hidden] { display: none; }
    .modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; }
    .modal-box h3 { margin: 0 0 6px; font-size: 16px; }
    .modal-box p { margin: 0 0 14px; font-size: 13px; color: #5f6368; line-height: 1.6; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: #3c4043; margin-bottom: 4px; font-weight: 600; }
    .field .hint { font-size: 12px; color: #80868b; margin-top: 4px; line-height: 1.5; }
    .field input { width: 100%; padding: 11px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; font-family: inherit; }
    .modal-err { color: #b3261e; font-size: 13px; min-height: 1.2em; margin-bottom: 6px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-actions button { border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
    .btn-cancel { background: #e8eaed; color: #3c4043; }
    .btn-ok { background: #0b8043; color: #fff; }

    /* ===== パスワードによるロック画面 ===== */
    .lock { position: fixed; inset: 0; z-index: 50; background: #f1f3f4; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .lock[hidden] { display: none; }
    .lock-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 22px; width: 100%; max-width: 340px; }
    .lock-box h2 { margin: 0 0 6px; font-size: 16px; color: #202124; }
    .lock-box p { margin: 0 0 14px; font-size: 13px; color: #5f6368; line-height: 1.6; }
    .lock-box input { width: 100%; padding: 11px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    .lock-err { color: #b3261e; font-size: 13px; margin-top: 8px; min-height: 1.2em; }
    .lock-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .lock-actions button { border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; background: #0b8043; color: #fff; }
  </style>
</head>
<body>
  <!-- URLを直接開いた場合もパスワードを要求する -->
  <div class="lock" id="lock">
    <div class="lock-box">
      <h2>設定を開く</h2>
      <p>管理者用のパスワードを入力してください。</p>
      <input type="password" id="lockPw" placeholder="パスワード" autocomplete="current-password">
      <div class="lock-err" id="lockErr"></div>
      <div class="lock-actions">
        <button id="lockOk" onclick="unlock()">開く</button>
      </div>
    </div>
  </div>

  <header>
    <div class="title">AIチャットボット設定</div>
    <a href="#" id="toMenu">メニューへ →</a>
  </header>

  <main>
    <div class="note" id="readonlyNote" hidden>
      あなたのアカウントには保存の権限がありません。内容の確認のみ可能です。
    </div>

    <div class="card">
      <h2>追加ルール</h2>
      <div id="ruleList"></div>
      <button class="add-btn" id="addRule" onclick="addRuleRow()">＋ ルールを追加</button>
      <div class="preview" id="preview"></div>
    </div>
  </main>

  <div class="savebar">
    <button id="save" onclick="save()">保存する</button>
    <span id="status"></span>
  </div>

  <!-- 新しいカテゴリを追加するモーダル -->
  <div class="modal" id="catModal" hidden>
    <div class="modal-box">
      <h3>新しいカテゴリ</h3>
      <p>カテゴリを追加すると、参照シートも自動で作成されます。</p>

      <div class="field">
        <label for="catName">カテゴリ名</label>
        <input type="text" id="catName" placeholder="例：総務系">
      </div>

      <div class="field">
        <label for="catSheet">参照シート名</label>
        <input type="text" id="catSheet" placeholder="例：総務規程">
        <div class="hint">規程の本文を貼り付けるシートです。空欄ならカテゴリ名と同じ名前で作成します。</div>
      </div>

      <div class="field">
        <label for="catPrefix">ID接頭辞</label>
        <input type="text" id="catPrefix" placeholder="例：S" maxlength="3">
        <div class="hint">空欄なら未使用のアルファベットを自動で割り当てます。</div>
      </div>

      <div class="modal-err" id="catErr"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeCatModal()">キャンセル</button>
        <button class="btn-ok" onclick="submitCat()">追加する</button>
      </div>
    </div>
  </div>

  <script>
    var canEdit = false;
    var password = '';       // 認証済みのパスワードを保持（保存時に一緒に送る）
    var categories = [];     // 登録済みカテゴリ [{id, name, sheet, prefix}]
    var newCategories = [];  // この画面で追加され、まだ保存していないカテゴリ
    var pendingSelect = null; // 「新しいカテゴリ」を選んだ <select>

    // メニュー画面へ戻る
    google.script.run.withSuccessHandler(function (url) {
      document.getElementById('toMenu').onclick = function (ev) {
        ev.preventDefault();
        window.top.location.href = url;
      };
    }).getWebAppUrl();

    /* ===== ロック解除 ===== */

    function unlock() {
      var pw = document.getElementById('lockPw').value;
      var err = document.getElementById('lockErr');
      if (!pw) { err.textContent = 'パスワードを入力してください。'; return; }

      document.getElementById('lockOk').disabled = true;
      err.textContent = '確認中...';
      tryLoad(pw, function () {
        document.getElementById('lockOk').disabled = false;
        err.textContent = 'パスワードが違います。';
      });
    }

    document.getElementById('lockPw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); unlock(); }
    });

    function tryLoad(pw, onFail) {
      google.script.run
        .withSuccessHandler(function (s) {
          // パスワードが違う場合はサーバーが null を返す
          if (!s) { onFail(); return; }

          password = pw;
          try { sessionStorage.setItem('ldcSettingsPw', pw); } catch (e) {}
          document.getElementById('lock').hidden = true;
          applySettings(s);
        })
        .withFailureHandler(function () { onFail(); })
        .getBotSettings(pw);
    }

    // メニュー画面でパスワードを入力済みなら、そのまま開く
    (function load() {
      var saved = '';
      try { saved = sessionStorage.getItem('ldcSettingsPw') || ''; } catch (e) {}
      if (!saved) return; // ロック画面のまま待つ

      tryLoad(saved, function () {
        try { sessionStorage.removeItem('ldcSettingsPw'); } catch (e) {}
      });
    })();

    /* ===== 画面の組み立て ===== */

    function applySettings(s) {
      canEdit = !!s.canEdit;
      categories = s.categories || [];
      newCategories = [];

      if (!canEdit) {
        document.getElementById('readonlyNote').hidden = false;
        document.getElementById('save').disabled = true;
        document.getElementById('addRule').disabled = true;
      }

      var list = document.getElementById('ruleList');
      list.innerHTML = '';
      (s.rules || []).forEach(function (r) {
        addRuleRow(r);
      });
      updatePreview();
    }

    // ルール1行分の入力欄を作る
    function addRuleRow(rule) {
      rule = rule || { ruleId: '', category: '', text: '' };
      var list = document.getElementById('ruleList');

      var row = document.createElement('div');
      row.className = 'rule';

      // ID（新規はまだ採番されていない）
      var badge = document.createElement('span');
      var isNew = !rule.ruleId;
      badge.className = 'rid' + (isNew ? ' new' : '');
      badge.textContent = isNew ? '新規' : rule.ruleId;
      row.appendChild(badge);

      // カテゴリのプルダウン（末尾に「新しいカテゴリ」を足す）
      var sel = document.createElement('select');
      sel.disabled = !canEdit;
      fillCategoryOptions(sel, rule.category);
      sel.addEventListener('change', function () {
        if (sel.value === '__new__') {
          openCatModal(sel);
        } else {
          updatePreview();
        }
      });
      row.appendChild(sel);

      // ルール本文
      var input = document.createElement('input');
      input.type = 'text';
      input.value = rule.text || '';
      input.placeholder = '例：在宅勤務は週2日まで。前日までに上長へ申請すること。';
      input.disabled = !canEdit;
      input.dataset.ruleId = rule.ruleId || '';
      input.addEventListener('input', updatePreview);
      row.appendChild(input);

      // 削除
      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'このルールを削除';
      del.disabled = !canEdit;
      del.addEventListener('click', function () {
        row.remove();
        updatePreview();
      });
      row.appendChild(del);

      list.appendChild(row);
      updatePreview();
    }

    // プルダウンの選択肢を作り直す
    function fillCategoryOptions(sel, selectedName) {
      var current = selectedName || sel.value || '';
      sel.innerHTML = '';

      if (!current) {
        var ph = document.createElement('option');
        ph.value = '';
        ph.textContent = 'カテゴリ選択';
        sel.appendChild(ph);
      }

      categories.forEach(function (c) {
        var op = document.createElement('option');
        op.value = c.name;
        op.textContent = c.name;
        sel.appendChild(op);
      });

      var add = document.createElement('option');
      add.value = '__new__';
      add.textContent = '＋ 新しいカテゴリ…';
      sel.appendChild(add);

      sel.value = current;
    }

    // すべてのプルダウンを作り直す（カテゴリ追加時）
    function refreshAllSelects() {
      var sels = document.querySelectorAll('.rule select');
      for (var i = 0; i < sels.length; i++) {
        fillCategoryOptions(sels[i], sels[i].value === '__new__' ? '' : sels[i].value);
      }
    }

    /* ===== 新しいカテゴリ ===== */

    function openCatModal(sel) {
      pendingSelect = sel || null;
      document.getElementById('catName').value = '';
      document.getElementById('catSheet').value = '';
      document.getElementById('catPrefix').value = '';
      document.getElementById('catErr').textContent = '';
      document.getElementById('catModal').hidden = false;
      setTimeout(function () { document.getElementById('catName').focus(); }, 50);
    }

    function closeCatModal() {
      document.getElementById('catModal').hidden = true;
      // 「新しいカテゴリ」を選んだままにしない
      if (pendingSelect && pendingSelect.value === '__new__') {
        fillCategoryOptions(pendingSelect, '');
      }
      pendingSelect = null;
    }

    function submitCat() {
      var name = document.getElementById('catName').value.trim();
      var sheet = document.getElementById('catSheet').value.trim();
      var prefix = document.getElementById('catPrefix').value.trim().toUpperCase();
      var err = document.getElementById('catErr');

      if (!name) { err.textContent = 'カテゴリ名を入力してください。'; return; }
      for (var i = 0; i < categories.length; i++) {
        if (categories[i].name === name) {
          err.textContent = 'その名前のカテゴリはすでにあります。';
          return;
        }
      }

      // 画面上のカテゴリ一覧に足す（実際の登録は保存時）
      var cat = { id: '', name: name, sheet: sheet || name, prefix: prefix || '?' };
      categories.push(cat);
      newCategories.push({ name: name, sheet: sheet, prefix: prefix });

      var target = pendingSelect;
      document.getElementById('catModal').hidden = true;
      pendingSelect = null;

      refreshAllSelects();
      if (target) {
        fillCategoryOptions(target, name);
      }
      updatePreview();
    }

    document.getElementById('catName').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submitCat(); }
    });

    /* ===== プレビュー ===== */

    // 規程シートに書き出される内容を表示する
    function updatePreview() {
      var pv = document.getElementById('preview');
      var rows = document.querySelectorAll('.rule');
      var byCat = {};
      var order = [];

      for (var i = 0; i < rows.length; i++) {
        var sel = rows[i].querySelector('select');
        var input = rows[i].querySelector('input');
        var name = sel.value;
        if (!name || name === '__new__') continue;
        var text = input.value.replace(/[\r\n]+/g, ' ').trim();
        if (!text) continue;

        var rid = input.dataset.ruleId || '（保存時に採番）';
        if (!byCat[name]) { byCat[name] = []; order.push(name); }
        byCat[name].push(name + '：' + text + '[' + rid + ']');
      }

      if (!order.length) {
        pv.innerHTML = '<span class="empty">追加ルールはまだありません。</span>';
        return;
      }

      var html = '';
      order.forEach(function (name) {
        var cat = findCat(name);
        html += '<strong>「' + escHtml(cat ? cat.sheet : name) + '」シートの末尾に書き出される内容</strong>';
        byCat[name].forEach(function (l) {
          html += '<div class="line">' + escHtml(l) + '</div>';
        });
      });
      pv.innerHTML = html;
    }

    function findCat(name) {
      for (var i = 0; i < categories.length; i++) {
        if (categories[i].name === name) return categories[i];
      }
      return null;
    }

    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ===== 保存 ===== */

    function save() {
      if (!canEdit) return;

      // カテゴリ未選択の行があれば知らせる
      var rows = document.querySelectorAll('.rule');
      var rules = [];
      for (var i = 0; i < rows.length; i++) {
        var sel = rows[i].querySelector('select');
        var input = rows[i].querySelector('input');
        var text = input.value.trim();
        if (!text) continue; // 空欄は送らない
        if (!sel.value || sel.value === '__new__') {
          alert('カテゴリが選ばれていないルールがあります。');
          return;
        }
        rules.push({ ruleId: input.dataset.ruleId || '', category: sel.value, text: text });
      }

      document.getElementById('save').disabled = true;
      document.getElementById('status').textContent = '保存中...';

      google.script.run
        .withSuccessHandler(function (msg) {
          document.getElementById('status').textContent = msg;
          document.getElementById('save').disabled = false;
          // 採番されたIDと新カテゴリを反映するため読み直す
          if (msg === '保存しました') {
            tryLoad(password, function () {});
          }
          setTimeout(function () { document.getElementById('status').textContent = ''; }, 4000);
        })
        .withFailureHandler(function () {
          document.getElementById('status').textContent = '';
          document.getElementById('save').disabled = false;
          alert('保存できませんでした。もう一度お試しください。');
        })
        .saveBotSettings({ rules: rules, newCategories: newCategories }, password);
    }
  </script>
</body>
</html>
