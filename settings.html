<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIチャットボット設定</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f1f3f4; color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    }
    header { background: #0b8043; color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
    header .title { font-size: 16px; font-weight: 600; flex: 1; }
    header a { color: #fff; font-size: 13px; text-decoration: none; background: rgba(255,255,255,.2); border-radius: 16px; padding: 7px 13px; }

    main { max-width: 720px; margin: 0 auto; padding: 16px 16px 96px; }

    .note { font-size: 13px; color: #5f6368; line-height: 1.7; background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
    .note[hidden] { display: none; }

    /* カテゴリ切り替えタブ */
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
    .tab {
      flex: 0 0 auto; border: 1px solid #cfd8dc; background: #fff; color: #3c4043;
      border-radius: 20px; padding: 9px 18px; font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .tab.active { background: #0b8043; border-color: #0b8043; color: #fff; font-weight: 600; }

    .panel[hidden] { display: none; }

    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 6px; font-size: 15px; color: #0b8043; }
    .card p.desc { margin: 0 0 10px; font-size: 13px; color: #5f6368; line-height: 1.6; }
    .card p.example { margin: 8px 0 0; font-size: 12px; color: #80868b; line-height: 1.6; }

    textarea {
      width: 100%; min-height: 130px; resize: vertical;
      border: 1px solid #ccc; border-radius: 8px; padding: 10px 12px;
      font-size: 14px; line-height: 1.6; font-family: inherit;
    }
    textarea:disabled { background: #f5f5f5; color: #80868b; }

    /* 画面下に固定した保存バー */
    .savebar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      background: #fff; border-top: 1px solid #e0e0e0; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px; justify-content: center;
    }
    .savebar button {
      background: #0b8043; color: #fff; border: none; border-radius: 8px;
      padding: 12px 28px; font-size: 15px; cursor: pointer;
    }
    .savebar button:disabled { opacity: .5; cursor: default; }
    #status { font-size: 14px; color: #0b8043; }

    /* ===== パスワードによるロック画面 ===== */
    .lock { position: fixed; inset: 0; z-index: 30; background: #f1f3f4; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .lock[hidden] { display: none; }
    .lock-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 22px; width: 100%; max-width: 340px; }
    .lock-box h2 { margin: 0 0 6px; font-size: 16px; color: #202124; }
    .lock-box p { margin: 0 0 14px; font-size: 13px; color: #5f6368; line-height: 1.6; }
    /* font-size:16px は iOS で入力時に画面が拡大されるのを防ぐため */
    .lock-box input { width: 100%; padding: 11px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    .lock-err { color: #b3261e; font-size: 13px; margin-top: 8px; min-height: 1.2em; }
    .lock-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .lock-actions button { border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; background: #0b8043; color: #fff; }
  </style>
</head>
<body>
  <!-- URLを直接開いた場合もパスワードを要求する -->
  <div class="lock" id="lock">
    <div class="lock-box">
      <h2>設定を開く</h2>
      <p>管理者用のパスワードを入力してください。</p>
      <input type="password" id="lockPw" placeholder="パスワード" autocomplete="current-password">
      <div class="lock-err" id="lockErr"></div>
      <div class="lock-actions">
        <button id="lockOk" onclick="unlock()">開く</button>
      </div>
    </div>
  </div>

  <header>
    <div class="title">AIチャットボット設定</div>
    <a href="#" id="toMenu">メニューへ →</a>
  </header>

  <main>
    <div class="note" id="readonlyNote" hidden>
      あなたのアカウントには保存の権限がありません。内容の確認のみ可能です。
    </div>

    <div class="note">
      規程の本文そのものは、スプレッドシートの各シートで編集してください。
      この画面では、カテゴリごとに<strong>追加する指示とルール</strong>を設定します。
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
  </main>

  <div class="savebar">
    <button id="save" onclick="save()">すべて保存する</button>
    <span id="status"></span>
  </div>

  <script>
    var canEdit = false;
    var password = '';    // 認証済みのパスワードを保持（保存時に一緒に送る）
    var categories = [];  // サーバーから取得したカテゴリ別設定

    // メニュー画面へ戻る
    google.script.run.withSuccessHandler(function (url) {
      document.getElementById('toMenu').onclick = function (ev) {
        ev.preventDefault();
        window.top.location.href = url;
      };
    }).getWebAppUrl();

    /* ===== ロック解除 ===== */

    function unlock() {
      var pw = document.getElementById('lockPw').value;
      var err = document.getElementById('lockErr');
      if (!pw) { err.textContent = 'パスワードを入力してください。'; return; }

      document.getElementById('lockOk').disabled = true;
      err.textContent = '確認中...';
      tryLoad(pw, function () {
        document.getElementById('lockOk').disabled = false;
        err.textContent = 'パスワードが違います。';
      });
    }

    document.getElementById('lockPw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); unlock(); }
    });

    /**
     * パスワードで設定を読み込む。失敗したら onFail を呼ぶ。
     */
    function tryLoad(pw, onFail) {
      google.script.run
        .withSuccessHandler(function (s) {
          // パスワードが違う場合はサーバーが null を返す
          if (!s) { onFail(); return; }

          password = pw;
          try { sessionStorage.setItem('ldcSettingsPw', pw); } catch (e) {}
          document.getElementById('lock').hidden = true;
          applySettings(s);
        })
        .withFailureHandler(function () { onFail(); })
        .getBotSettings(pw);
    }

    // チャット画面でパスワードを入力済みなら、そのまま開く
    (function load() {
      var saved = '';
      try { saved = sessionStorage.getItem('ldcSettingsPw') || ''; } catch (e) {}
      if (!saved) return; // ロック画面のまま待つ

      tryLoad(saved, function () {
        // 保存されていたパスワードが無効ならロック画面を出す
        try { sessionStorage.removeItem('ldcSettingsPw'); } catch (e) {}
      });
    })();

    /* ===== 画面の組み立て ===== */

    function applySettings(s) {
      canEdit = !!s.canEdit;
      categories = s.categories || [];

      if (!canEdit) {
        document.getElementById('readonlyNote').hidden = false;
        document.getElementById('save').disabled = true;
      }

      var tabs = document.getElementById('tabs');
      var panels = document.getElementById('panels');
      tabs.innerHTML = '';
      panels.innerHTML = '';

      categories.forEach(function (c, index) {
        // タブ
        var tab = document.createElement('button');
        tab.className = 'tab' + (index === 0 ? ' active' : '');
        tab.textContent = c.name;
        tab.addEventListener('click', function () { showTab(index); });
        tabs.appendChild(tab);

        // パネル
        var panel = document.createElement('div');
        panel.className = 'panel';
        panel.hidden = (index !== 0);
        panel.innerHTML =
          '<div class="note">参照シート：<strong>' + escHtml(c.sheet) + '</strong>' +
          '（登録量：約' + (c.rulesLength || 0).toLocaleString() + '文字）</div>' +

          '<div class="card">' +
            '<h2>AIへの追加指示</h2>' +
            '<p class="desc">回答の仕方についての指示を追加できます。' +
            escHtml(c.name) + 'の質問のたびにAIへ一緒に送られます。</p>' +
            '<textarea data-kind="instruction" placeholder="例：回答は3行以内で簡潔にまとめてください。"></textarea>' +
            '<p class="example">例：「回答の最後に必ず担当部署の連絡先を添えてください。」<br>' +
            '例：「専門用語は使わず、新入社員にもわかる言葉で説明してください。」</p>' +
          '</div>' +

          '<div class="card">' +
            '<h2>追加ルール（規程への追記）</h2>' +
            '<p class="desc">規程には書かれていない社内ルールや運用を追記できます。' +
            'AIは規程本文とあわせて、ここの内容も根拠として回答します。</p>' +
            '<textarea data-kind="rules" placeholder="例：申請は3営業日前までに社内システムから行うこと。"></textarea>' +
            '<p class="example">例：「在宅勤務は週2日まで。前日までに上長へ申請すること。」<br>' +
            '例：「申請書は社内ポータルの様式集にあります。」</p>' +
          '</div>';

        // テキストエリアに現在値を入れる（textContent で安全に設定）
        var ta = panel.querySelectorAll('textarea');
        ta[0].value = c.extraInstruction || '';
        ta[1].value = c.extraRules || '';
        if (!canEdit) {
          ta[0].disabled = true;
          ta[1].disabled = true;
        }

        panels.appendChild(panel);
      });

      document.getElementById('status').textContent = '';
    }

    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function showTab(index) {
      var tabs = document.querySelectorAll('.tab');
      var panels = document.querySelectorAll('.panel');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.toggle('active', i === index);
        panels[i].hidden = (i !== index);
      }
    }

    /* ===== 保存 ===== */

    function save() {
      if (!canEdit) return;
      document.getElementById('save').disabled = true;
      document.getElementById('status').textContent = '保存中...';

      // 全カテゴリ分をまとめて送る
      var panels = document.querySelectorAll('.panel');
      var items = categories.map(function (c, i) {
        var ta = panels[i].querySelectorAll('textarea');
        return { id: c.id, extraInstruction: ta[0].value, extraRules: ta[1].value };
      });

      google.script.run
        .withSuccessHandler(function (msg) {
          document.getElementById('status').textContent = msg;
          document.getElementById('save').disabled = false;
          setTimeout(function () { document.getElementById('status').textContent = ''; }, 4000);
        })
        .withFailureHandler(function () {
          document.getElementById('status').textContent = '';
          document.getElementById('save').disabled = false;
          alert('保存できませんでした。もう一度お試しください。');
        })
        .saveBotSettings(items, password);
    }
  </script>
</body>
</html>
