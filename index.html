<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIチャットボット</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #f1f3f4; color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    header { flex: 0 0 auto; background: #0b8043; color: #fff; padding: 14px;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    header .title { font-size: 17px; font-weight: 600; flex: 1; }
    header .gear { flex: 0 0 auto; background: rgba(255,255,255,.2); color: #fff; border: none;
      border-radius: 16px; padding: 7px 13px; font-size: 14px; cursor: pointer; }
    header .gear:active { background: rgba(255,255,255,.35); }

    main { flex: 1 1 auto; max-width: 640px; width: 100%; margin: 0 auto; padding: 16px; }
    .lead { font-size: 14px; color: #5f6368; margin: 0 0 14px; line-height: 1.6; }

    .menu { display: flex; flex-direction: column; gap: 12px; }
    .menu-item {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      background: #fff; border: 1px solid #e0e0e0; border-radius: 12px;
      padding: 18px 16px; font: inherit; cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .menu-item:active { background: #e8f5ee; }
    .menu-item .icon {
      flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
      background: #e8f5ee; display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .menu-item .body { flex: 1; min-width: 0; }
    .menu-item .name { display: block; font-size: 17px; font-weight: 600; }
    .menu-item .desc { display: block; font-size: 13px; color: #5f6368; margin-top: 3px; line-height: 1.5; }
    .menu-item .arrow { flex: 0 0 auto; color: #0b8043; font-size: 20px; }

    /* ===== パスワード入力モーダル ===== */
    .modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center;
      justify-content: center; background: rgba(0,0,0,.45); padding: 16px; }
    .modal[hidden] { display: none; }
    .modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 340px; }
    .modal-box h3 { margin: 0 0 6px; font-size: 16px; }
    .modal-box p { margin: 0 0 14px; font-size: 13px; color: #5f6368; line-height: 1.6; }
    /* font-size:16px は iOS で入力時に画面が拡大されるのを防ぐため */
    .modal-box input { width: 100%; padding: 11px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    .modal-err { color: #b3261e; font-size: 13px; margin-top: 8px; min-height: 1.2em; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .modal-actions button { border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
    .btn-cancel { background: #e8eaed; color: #3c4043; }
    .btn-ok { background: #0b8043; color: #fff; }
    .btn-ok:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="title">AIチャットボット</div>
    <button class="gear" id="settingsBtn" onclick="openPwModal()" aria-label="設定">⚙</button>
  </header>

  <main>
    <p class="lead">聞きたい分野を選んでください。それぞれの規程にもとづいて回答します。</p>
    <div class="menu" id="menu"></div>
  </main>

  <!-- 設定画面を開くためのパスワード入力モーダル -->
  <div class="modal" id="pwModal" hidden>
    <div class="modal-box">
      <h3>設定を開く</h3>
      <p>管理者用のパスワードを入力してください。</p>
      <input type="password" id="pwInput" placeholder="パスワード" autocomplete="current-password">
      <div class="modal-err" id="pwErr"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closePwModal()">キャンセル</button>
        <button class="btn-ok" id="pwOk" onclick="submitPw()">開く</button>
      </div>
    </div>
  </div>

  <script>
    // サーバー側から埋め込まれたカテゴリ定義
    var CATEGORIES = <?= categoriesJson ?>;

    // 画面遷移用にWebアプリのURLを取得しておく
    var webAppUrl = '';
    google.script.run.withSuccessHandler(function (url) { webAppUrl = url; }).getWebAppUrl();

    // メニューを描画する
    (function renderMenu() {
      var menu = document.getElementById('menu');
      CATEGORIES.forEach(function (c) {
        var btn = document.createElement('button');
        btn.className = 'menu-item';

        var icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = c.icon || '💬';

        var body = document.createElement('span');
        body.className = 'body';
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = c.name;
        var desc = document.createElement('span');
        desc.className = 'desc';
        desc.textContent = c.desc || '';
        body.appendChild(name);
        body.appendChild(desc);

        var arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = '›';

        btn.appendChild(icon);
        btn.appendChild(body);
        btn.appendChild(arrow);

        btn.addEventListener('click', function () {
          if (!webAppUrl) return;
          window.top.location.href = webAppUrl + '?app=bot&cat=' + encodeURIComponent(c.id);
        });

        menu.appendChild(btn);
      });
    })();

    /* ===== 設定を開く（パスワード） ===== */

    function openPwModal() {
      document.getElementById('pwInput').value = '';
      document.getElementById('pwErr').textContent = '';
      document.getElementById('pwModal').hidden = false;
      setTimeout(function () { document.getElementById('pwInput').focus(); }, 50);
    }

    function closePwModal() {
      document.getElementById('pwModal').hidden = true;
    }

    function submitPw() {
      var pw = document.getElementById('pwInput').value;
      var ok = document.getElementById('pwOk');
      var err = document.getElementById('pwErr');
      if (!pw) { err.textContent = 'パスワードを入力してください。'; return; }

      ok.disabled = true;
      err.textContent = '確認中...';

      // 照合はサーバー側で行う
      google.script.run
        .withSuccessHandler(function (valid) {
          ok.disabled = false;
          if (!valid) {
            err.textContent = 'パスワードが違います。';
            return;
          }
          err.textContent = '';
          // 設定画面で再入力させないように一時的に保持する
          try { sessionStorage.setItem('ldcSettingsPw', pw); } catch (e) {}
          closePwModal();
          window.top.location.href = webAppUrl + '?app=settings';
        })
        .withFailureHandler(function () {
          ok.disabled = false;
          err.textContent = '確認できませんでした。もう一度お試しください。';
        })
        .checkSettingsPassword(pw);
    }

    document.getElementById('pwInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submitPw(); }
    });
  </script>
</body>
</html>
