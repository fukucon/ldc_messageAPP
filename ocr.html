<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF OCR</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; font-size: 15px; border: none; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: #1a73e8; margin: 8px 0; min-height: 1.2em; }
    pre { background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>PDF OCR (Gemini)</h1>

  <div class="row">
    <input type="text" id="fileId" placeholder="DriveのPDFファイルIDを入力">
    <button id="run" onclick="runOcr()">OCR実行</button>
  </div>

  <div id="status"></div>
  <pre id="result"></pre>

  <script>
    function runOcr() {
      var fileId = document.getElementById('fileId').value.trim();
      if (!fileId) { alert('ファイルIDを入力してください'); return; }

      document.getElementById('run').disabled = true;
      document.getElementById('status').textContent = '読み取り中...';
      document.getElementById('result').textContent = '';

      google.script.run
        .withSuccessHandler(function (text) {
          document.getElementById('status').textContent = '完了';
          document.getElementById('result').textContent = text;
          document.getElementById('run').disabled = false;
        })
        .withFailureHandler(function (err) {
          document.getElementById('status').textContent = '';
          document.getElementById('run').disabled = false;
          alert('エラー: ' + err.message);
        })
        .ocrPdfWithGemini(fileId);
    }
  </script>
</body>
</html>
